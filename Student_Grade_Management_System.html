<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Management System</title>
    <script src="Student_Grade_Management_System.js" defer></script>
    <link rel="stylesheet" href = './Student_Grade_Management_System.css'>
</head>
<body>
    <main class="main-container">
        <header class="page-header">
            <h1>
                Student Grade Management System
            </h1>
            <p>
                Enter student information and marks to calculate
                the average and letter grade.
            </p>
        </header>
        <section class="form-section">
            <h2>Student Information</h2>
            <form id="grade-form">
                <div class="form-group">
                    <label for="student-name"> Student Name </label>
                    <input type='text' id="student-name" name="studentName" placeholder="Please Enter Student Name " required>
                </div>
                <div class="form-group">
                    <label for="Data Structures and Algorithms">
                        DSA
                    </label>
                     <input
                        type="number"
                        id="DSA"
                        name="DSA"
                        placeholder="Enter mark"
                        min="0"
                        max="100"
                        step="any"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="Introduction to Database Systems">Database Systems</label>

                    <input
                        type="number"
                        id="DB"
                        name="DB"
                        placeholder="Enter mark"
                        min="0"
                        max="100"
                        step="any"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="Calculus II">Calculus II</label>

                    <input
                        type="number"
                        id="Calculus"
                        name="Calculus"
                        placeholder="Enter mark"
                        min="0"
                        max="100"
                        step="any"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="Psychology">Psychology</label>

                    <input
                        type="number"
                        id="Psychology"
                        name="Psychology"
                        placeholder="Enter mark"
                        min="0"
                        max="100"
                        step="any"
                        required
                    >
                </div>
                <div class="button-group">
                    <button type='submit'> Calculate Grade</button>

                    <button type="reset" class="reset-button">Reset</button>
                </div>
            </form>
        </section>
        <section  id="results" class="results-section" aria-live="polite">
            <h2>Results</h2>
             <p>Your results will appear here after calculation.</p>
        </section>
    </main>
</body>
</html>
